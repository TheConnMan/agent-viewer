name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: agent-viewer-x86_64-unknown-linux-gnu.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: agent-viewer-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: agent-viewer-aarch64-apple-darwin.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: agent-viewer-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/agent-viewer --version

      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "target/${{ matrix.target }}/release/agent-viewer.exe" --version'

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.archive }}" agent-viewer
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $archive = "${{ matrix.archive }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/agent-viewer.exe" -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Resolve-Path dist).Path "$archive.sha256"
          [System.IO.File]::WriteAllText($checksumPath, "$hash  $archive", [System.Text.Encoding]::ASCII)

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packaged binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assert release assets
        shell: bash
        run: |
          expected=(
            agent-viewer-aarch64-apple-darwin.tar.gz
            agent-viewer-aarch64-apple-darwin.tar.gz.sha256
            agent-viewer-x86_64-apple-darwin.tar.gz
            agent-viewer-x86_64-apple-darwin.tar.gz.sha256
            agent-viewer-x86_64-pc-windows-msvc.zip
            agent-viewer-x86_64-pc-windows-msvc.zip.sha256
            agent-viewer-x86_64-unknown-linux-gnu.tar.gz
            agent-viewer-x86_64-unknown-linux-gnu.tar.gz.sha256
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ ${#actual[@]} -ne ${#expected[@]} ]]; then
            printf 'Unexpected release asset count: %s\n' "${#actual[@]}"
            printf 'Found: %s\n' "${actual[@]}"
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [[ "${actual[$index]}" != "${expected[$index]}" ]]; then
              printf 'Expected %s but found %s\n' "${expected[$index]}" "${actual[$index]}"
              exit 1
            fi
          done
          cd dist
          sha256sum --check ./*.sha256

      - name: Publish verified GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            agent-viewer-aarch64-apple-darwin.tar.gz
            agent-viewer-aarch64-apple-darwin.tar.gz.sha256
            agent-viewer-x86_64-apple-darwin.tar.gz
            agent-viewer-x86_64-apple-darwin.tar.gz.sha256
            agent-viewer-x86_64-pc-windows-msvc.zip
            agent-viewer-x86_64-pc-windows-msvc.zip.sha256
            agent-viewer-x86_64-unknown-linux-gnu.tar.gz
            agent-viewer-x86_64-unknown-linux-gnu.tar.gz.sha256
          )

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          peeled_ref="$tag_ref^{}"
          remote_refs=$(git ls-remote --exit-code origin "$tag_ref" "$peeled_ref")
          direct_object=
          peeled_commit=
          while IFS=$'\t' read -r object_id ref_name; do
            case "$ref_name" in
              "$tag_ref") direct_object="$object_id" ;;
              "$peeled_ref") peeled_commit="$object_id" ;;
              *)
                printf 'Unexpected remote ref: %s\n' "$ref_name" >&2
                exit 1
                ;;
            esac
          done <<< "$remote_refs"
          if [[ -z "$direct_object" ]]; then
            printf 'Remote tag %s did not resolve.\n' "$tag_ref" >&2
            exit 1
          fi
          remote_commit="${peeled_commit:-$direct_object}"
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            printf 'Remote tag commit %s does not match workflow commit %s.\n' \
              "$remote_commit" "$GITHUB_SHA" >&2
            exit 1
          fi

          release_json=$(mktemp)
          api_error=$(mktemp)
          remote_dir=$(mktemp -d)
          trap 'rm -f "$release_json" "$api_error"; rm -rf "$remote_dir"' EXIT

          release_state=new
          if gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" > "$release_json" 2> "$api_error"; then
            if [[ $(jq -r '.draft' "$release_json") == true ]]; then
              release_state=draft
            else
              release_state=public
            fi
          elif ! grep -q 'HTTP 404' "$api_error"; then
            cat "$api_error" >&2
            exit 1
          fi

          if [[ "$release_state" == new ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          elif [[ "$release_state" == draft ]]; then
            mapfile -t asset_ids < <(jq -r '.assets[].id' "$release_json")
            for asset_id in "${asset_ids[@]}"; do
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            done
          fi

          if [[ "$release_state" != public ]]; then
            upload_paths=()
            for asset in "${expected[@]}"; do
              upload_paths+=("dist/$asset")
            done
            gh release upload "$GITHUB_REF_NAME" "${upload_paths[@]}"
          fi

          gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" > "$release_json"
          mapfile -t remote_names < <(jq -r '.assets[].name' "$release_json" | sort)
          if [[ ${#remote_names[@]} -ne ${#expected[@]} ]]; then
            printf 'Unexpected remote asset count: %s\n' "${#remote_names[@]}" >&2
            printf 'Found: %s\n' "${remote_names[@]}" >&2
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [[ "${remote_names[$index]}" != "${expected[$index]}" ]]; then
              printf 'Expected remote asset %s but found %s\n' \
                "${expected[$index]}" "${remote_names[$index]}" >&2
              exit 1
            fi
          done

          for asset in "${expected[@]}"; do
            asset_id=$(jq -r --arg name "$asset" \
              '.assets[] | select(.name == $name) | .id' "$release_json")
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GH_REPO/releases/assets/$asset_id" > "$remote_dir/$asset"
            local_digest=$(sha256sum "dist/$asset" | awk '{print $1}')
            remote_digest=$(sha256sum "$remote_dir/$asset" | awk '{print $1}')
            if [[ "$local_digest" != "$remote_digest" ]]; then
              printf 'Digest mismatch for remote asset %s\n' "$asset" >&2
              exit 1
            fi
          done

          if [[ "$release_state" != public ]]; then
            tag_ref="refs/tags/$GITHUB_REF_NAME"
            peeled_ref="$tag_ref^{}"
            remote_refs=$(git ls-remote --exit-code origin "$tag_ref" "$peeled_ref")
            direct_object=
            peeled_commit=
            while IFS=$'\t' read -r object_id ref_name; do
              case "$ref_name" in
                "$tag_ref") direct_object="$object_id" ;;
                "$peeled_ref") peeled_commit="$object_id" ;;
                *)
                  printf 'Unexpected remote ref: %s\n' "$ref_name" >&2
                  exit 1
                  ;;
              esac
            done <<< "$remote_refs"
            if [[ -z "$direct_object" ]]; then
              printf 'Remote tag %s did not resolve.\n' "$tag_ref" >&2
              exit 1
            fi
            remote_commit="${peeled_commit:-$direct_object}"
            if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
              printf 'Remote tag commit %s does not match workflow commit %s.\n' \
                "$remote_commit" "$GITHUB_SHA" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            printf 'Existing public release matches all local assets.\n'
          fi

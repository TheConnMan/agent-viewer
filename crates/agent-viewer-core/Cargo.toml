[package]
name = "agent-viewer-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
inotify = { version = "0.11.4", default-features = false }
libc = "0.2.186"
portable-pty = "0.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.6"
thiserror = "2.0.18"
tungstenite = "0.30.0"
vt100 = "0.16"

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27.0"

[package]
name = "agent-viewer-core"
description = "Backend-reading library for agent-viewer: registry readers, rollout parsers, status resolution, and session control."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
portable-pty = "0.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.6"
thiserror = "2.0.18"
tungstenite = "0.30.0"
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
# default-features off drops criterion's plotters/rayon trees; `cargo_bench_support` is the
# only feature `cargo bench` needs to drive these targets.
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }
serde_json = "1.0.150"
tempfile = "3.27.0"

[[bench]]
name = "transcript_parse"
harness = false

[[bench]]
name = "listing_cache"
harness = false

[[bench]]
name = "status_resolve"
harness = false
